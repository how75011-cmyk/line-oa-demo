<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>禾光雜貨 店家後台</title>
<style>
:root{--green:#06C755;--ink:#1f2328;--soft:#5f6672;--line:#e3e6ea;--page:#f4f5f7;--warn:#b42318;--warnbg:#fff1f0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--page)}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px}
header div{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-size:19px}
header span{font-size:13px;color:var(--soft)}
main{max-width:1040px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
section h2{font-size:16px;margin-bottom:12px}
.full{grid-column:1/-1}
textarea,input[type=text],input[type=datetime-local],input[type=password]{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
.rowf{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.rowf label{font-size:13px;color:var(--soft)}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit}
button.primary{background:var(--green);border-color:var(--green);color:#fff}
.hint{font-size:13px;color:var(--soft);margin-top:8px;line-height:1.6}
.finding{background:var(--warnbg);border-left:3px solid var(--warn);padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.6;border-radius:4px}
.finding b{color:var(--warn)}
.ok{color:#0a8a3d;font-size:14px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--soft);font-weight:500;font-size:13px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.card .meta{font-size:12px;color:var(--soft)}
.card ul{margin:8px 0 8px 18px;font-size:14px;line-height:1.7}
.empty{color:var(--soft);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--page);border-radius:10px;padding:12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--soft)}
.kw{margin-top:12px;font-size:14px;line-height:1.8}
#tokenBox{display:none}
@media (max-width:820px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>禾光雜貨 店家後台</h1><span id="conn">示範模式</span></div></header>
<main>
  <section class="full" id="tokenBox">
    <h2>輸入後台密碼</h2>
    <div class="rowf"><input type="password" id="token" placeholder="ADMIN_TOKEN"><button id="saveToken" class="primary">進入</button></div>
  </section>

  <section>
    <h2>排程推播</h2>
    <textarea id="bText" maxlength="1000" placeholder="例如：手作陶杯補貨到了，週末單筆滿 NT$1,200 免運。"></textarea>
    <div class="rowf">
      <label for="bAt">送出時間（空白＝現在）</label>
      <input type="datetime-local" id="bAt" style="max-width:240px">
    </div>
    <div class="rowf">
      <button id="check">檢查用語</button>
      <button id="send" class="primary">排程送出</button>
    </div>
    <div id="result"></div>
    <p class="hint">送出前會先檢查醫療效能、誇大、易生誤解的用語。有問題的文案預設不送出，確認後才能強制排程。</p>
  </section>

  <section>
    <h2>真人客服</h2>
    <div id="handoffs"><p class="empty">目前沒有等待中的顧客。</p></div>
  </section>

  <section>
    <h2>推播紀錄</h2>
    <table><thead><tr><th>時間</th><th>內容</th><th>狀態</th></tr></thead><tbody id="bLog"></tbody></table>
  </section>

  <section>
    <h2>數據</h2>
    <div class="stats">
      <div class="stat"><b id="sUsers">0</b><span>互動人數</span></div>
      <div class="stat"><b id="sMsgs">0</b><span>收到訊息</span></div>
      <div class="stat"><b id="sHand">0</b><span>轉真人</span></div>
    </div>
    <div class="kw" id="kw"></div>
  </section>
</main>

<script>
let token = "";
try { token = sessionStorage.getItem("hg-admin-token") || ""; } catch (e) {}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

async function api(path, body) {
  const opts = {headers: {"X-Admin-Token": token}};
  if (body) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (res.status === 401) {
    document.getElementById("tokenBox").style.display = "block";
    throw new Error("401");
  }
  return {status: res.status, data: await res.json()};
}

document.getElementById("saveToken").onclick = () => {
  token = document.getElementById("token").value;
  try { sessionStorage.setItem("hg-admin-token", token); } catch (e) {}
  document.getElementById("tokenBox").style.display = "none";
  refresh();
};

function showFindings(findings, allowForce) {
  const box = document.getElementById("result");
  box.replaceChildren();
  if (!findings.length) {
    box.appendChild(el("p", "ok", "沒有發現常見的違規用語。"));
    return;
  }
  findings.forEach(f => {
    const d = el("div", "finding");
    const head = el("div");
    head.appendChild(el("b", null, "「" + f.word + "」"));
    head.appendChild(document.createTextNode("　" + f.category));
    d.appendChild(head);
    d.appendChild(el("div", null, "可能涉及：" + f.law));
    d.appendChild(el("div", null, "建議：" + f.suggestion));
    box.appendChild(d);
  });
  box.appendChild(el("p", "hint", "此為用語初篩，不是法律意見。"));
  if (allowForce) {
    const b = el("button", null, "我已確認，仍要排程");
    b.style.marginTop = "10px";
    b.onclick = () => schedule(true);
    box.appendChild(b);
  }
}

document.getElementById("check").onclick = async () => {
  const text = document.getElementById("bText").value;
  if (!text.trim()) return;
  const r = await api("/api/admin/check", {text});
  showFindings(r.data.findings, false);
};

async function schedule(acknowledge) {
  const text = document.getElementById("bText").value.trim();
  if (!text) return;
  const send_at = document.getElementById("bAt").value || null;
  const r = await api("/api/admin/broadcast", {text, send_at, acknowledge});
  if (r.status === 422) { showFindings(r.data.findings, true); return; }
  const box = document.getElementById("result");
  box.replaceChildren(el("p", "ok", send_at ? "已排程。" : "已送出，模擬器畫面會收到這則推播。"));
  document.getElementById("bText").value = "";
  refresh();
}
document.getElementById("send").onclick = () => schedule(false);

let lastHandoffs = "";
function renderHandoffs(list) {
  const key = JSON.stringify(list);
  if (key === lastHandoffs) return;
  if (document.activeElement && document.activeElement.dataset.reply) return; // don't wipe typing
  lastHandoffs = key;
  const box = document.getElementById("handoffs");
  box.replaceChildren();
  if (!list.length) { box.appendChild(el("p", "empty", "目前沒有等待中的顧客。")); return; }
  list.forEach(h => {
    const c = el("div", "card");
    c.appendChild(el("div", "meta", "顧客 " + h.user_id + "｜" + h.since.replace("T", " ") + " 起"));
    const ul = el("ul");
    h.messages.forEach(m => ul.appendChild(el("li", null, m)));
    c.appendChild(ul);
    const input = el("input");
    input.type = "text";
    input.placeholder = "回覆這位顧客";
    input.dataset.reply = "1";
    const row = el("div", "rowf");
    const send = el("button", "primary", "回覆");
    send.onclick = async () => {
      if (!input.value.trim()) return;
      await api("/api/admin/reply", {user_id: h.user_id, text: input.value});
      input.value = "";
    };
    const done = el("button", null, "結束對話");
    done.onclick = async () => { await api("/api/admin/resolve", {user_id: h.user_id}); lastHandoffs = ""; refresh(); };
    row.append(send, done);
    c.append(input, row);
    box.appendChild(c);
  });
}

function renderLog(list) {
  const body = document.getElementById("bLog");
  body.replaceChildren();
  if (!list.length) {
    const tr = el("tr");
    const td = el("td", "empty", "還沒有推播。");
    td.colSpan = 3;
    tr.appendChild(td);
    body.appendChild(tr);
    return;
  }
  list.slice().reverse().forEach(b => {
    const tr = el("tr");
    tr.append(
      el("td", null, b.send_at.replace("T", " ")),
      el("td", null, b.text + (b.findings.length ? "（含 " + b.findings.length + " 個提醒用語）" : "")),
      el("td", null, b.status === "sent" ? "已送出" : "排程中")
    );
    body.appendChild(tr);
  });
}

const KW_LABEL = {"看商品": "看商品", "查訂單": "查訂單", "運費": "運費", "退貨": "退換貨", "營業時間": "營業時間", "付款": "付款", "訂購": "點訂購", "真人客服": "真人客服", "未命中": "答不出來"};
function renderStats(s, users) {
  document.getElementById("sUsers").textContent = users;
  document.getElementById("sMsgs").textContent = s.messages || 0;
  document.getElementById("sHand").textContent = s.handoff || 0;
  const kws = Object.entries(s).filter(([k]) => k.startsWith("kw:"))
    .map(([k, v]) => [KW_LABEL[k.slice(3)] || k.slice(3), v]).sort((a, b) => b[1] - a[1]);
  document.getElementById("kw").textContent = kws.length
    ? "顧客最常問：" + kws.map(([k, v]) => k + " " + v + " 次").join("、")
    : "還沒有顧客互動。打開模擬器試試看。";
}

async function refresh() {
  try {
    const r = await api("/api/admin/state");
    renderHandoffs(r.data.handoffs);
    renderLog(r.data.broadcasts);
    renderStats(r.data.stats, r.data.users);
    document.getElementById("conn").textContent = r.data.line_connected ? "已連接 LINE" : "示範模式（未連接 LINE）";
  } catch (e) {}
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
